<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jugaad Fluency</title>
<meta name="description" content="Reels jaisi English speaking practice: swipe karo, bolo, seekho.">
<meta name="theme-color" content="#1B1740">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1B1740; --paper:#FFF6E5; --marigold:#F7B32B; --mint:#57C4A0; --jamun:#6C4BC4;
  --chilli:#EE5A45; --sky:#4FA3E0; --gulabi:#F28AB2; --teal:#0F6E68;
  --bg:#1B1740; --surface:#26215A; --text:#FFF6E5; --muted:#C9C3E8; --line:#3B3578;
  --font:"Baloo 2", ui-rounded, "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){--bg:#FFF6E5;--surface:#FFFFFF;--text:#1B1740;--muted:#5A5480;--line:#E8DCC4;color-scheme:light}
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button{font:inherit}
p{margin:0}

/* Feed */
#feed{height:100dvh;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior-y:contain;scrollbar-width:none}
#feed::-webkit-scrollbar{display:none}
.card{--c-bg:var(--marigold);--c-fg:var(--ink);background:var(--c-bg);color:var(--c-fg);height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;display:flex}
.card .inner{flex:1;overflow-y:auto;width:100%;max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:14px;
  padding:calc(env(safe-area-inset-top,0px) + 66px) 22px calc(env(safe-area-inset-bottom,0px) + 92px)}
.t-word{--c-bg:var(--marigold)} .t-phrase{--c-bg:var(--mint)} .t-shadow{--c-bg:var(--jamun);--c-fg:var(--paper)}
.t-drill{--c-bg:var(--chilli)} .t-quiz{--c-bg:var(--sky)} .t-recall{--c-bg:var(--gulabi)}
.t-speak{--c-bg:var(--ink);--c-fg:var(--paper)} .t-role{--c-bg:var(--teal);--c-fg:var(--paper)} .t-note{--c-bg:var(--paper);--c-fg:var(--ink)}
.t-speak .inner{border-inline:3px solid var(--marigold)}

.chip{align-self:flex-start;border:2px solid currentColor;border-radius:999px;padding:1px 12px;font-weight:700;font-size:.95rem}
.big{font-size:clamp(2.5rem,12vw,4.4rem);font-weight:800;line-height:1;margin:6px 0 0;letter-spacing:-.01em;overflow-wrap:anywhere}
.say{font-size:clamp(1.55rem,6.4vw,2.3rem);font-weight:700;line-height:1.18;margin:4px 0 0}
.mean{font-size:1.25rem;font-weight:600}
.ex{font-size:1.05rem;opacity:.9}
.hint,.muted{opacity:.82}
.small{font-size:.9rem}
.task{font-weight:600;margin-top:6px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.two>.btn{flex:1}

.btn{border:2px solid var(--c-fg);background:transparent;color:var(--c-fg);border-radius:999px;padding:10px 20px;min-height:48px;font-weight:700;font-size:1rem;cursor:pointer;touch-action:manipulation}
.btn.main{background:var(--c-fg);color:var(--c-bg)}
.btn.tiny{min-height:34px;padding:2px 12px;font-size:.88rem}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.field:focus-visible,summary:focus-visible{outline:3px solid var(--c-fg);outline-offset:3px}
.btn.rec{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 12px color-mix(in srgb,var(--c-fg) 22%,transparent)}}

.field{flex:1;min-width:0;font:inherit;font-size:1rem;padding:10px 14px;border-radius:14px;border:2px solid var(--c-fg);background:transparent;color:var(--c-fg)}
.field::placeholder{color:currentColor;opacity:.6}
.typerow{display:flex;gap:8px}
.typerow[hidden]{display:none}
.live{font-style:italic;opacity:.85;min-height:1.4em}

.out{display:grid;gap:10px}
.fb{background:color-mix(in srgb,var(--c-fg) 12%,transparent);border-radius:20px;padding:14px 16px;display:grid;gap:4px}
.lbl{font-size:.85rem;font-weight:700;opacity:.72;margin-top:6px}
.strong{font-weight:700;font-size:1.1rem}
.tip{margin-top:6px}
.praise{font-weight:700;margin-top:6px}
.src{font-size:.8rem;opacity:.65;margin-top:6px}
.hit,.miss{font-weight:800;font-size:1.25rem}
.wait{opacity:.75}
.diff s{opacity:.45}
.score{font-size:2.4rem;font-weight:800;line-height:1}
.stamp{align-self:flex-start;border:2px dashed currentColor;border-radius:14px;padding:6px 14px;font-weight:800;transform:rotate(-2deg);animation:stamp .35s ease-out}
@keyframes stamp{from{transform:rotate(-8deg) scale(1.4);opacity:0}}

.bubble{background:var(--c-fg);color:var(--c-bg);border-radius:22px 22px 22px 6px;padding:14px 16px;display:grid;gap:6px}
.bubble .btn{border-color:var(--c-bg);color:var(--c-bg);justify-self:start}
.who{font-size:.85rem;font-weight:700;opacity:.75}
.line{font-size:1.2rem;font-weight:600}
details.help summary{cursor:pointer;font-weight:700}
details.help p{margin-top:6px}

.timer{display:flex;align-items:baseline;gap:6px}
.secs{font-size:4.6rem;font-weight:800;line-height:1;color:var(--marigold);font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:color-mix(in srgb,var(--c-fg) 10%,transparent);border-radius:16px;padding:10px}
.stat b{display:block;font-size:1.5rem;line-height:1.1}
.stat span{font-size:.82rem;opacity:.8}

/* HUD + tabs */
.hud{position:fixed;inset:0 0 auto;z-index:20;display:flex;justify-content:center;gap:6px;padding:calc(env(safe-area-inset-top,0px) + 10px) 10px 8px;pointer-events:none}
.pill{pointer-events:auto;background:rgba(27,23,64,.84);color:#FFF6E5;border-radius:999px;padding:4px 12px;font-weight:700;font-size:.95rem;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);font-variant-numeric:tabular-nums}
.pill.risk{box-shadow:inset 0 0 0 2px #F7B32B}
.tabs{position:fixed;inset:auto 0 0;z-index:20;display:flex;justify-content:center;gap:8px;padding:8px 10px calc(env(safe-area-inset-bottom,0px) + 10px);pointer-events:none}
.tabs button{pointer-events:auto;background:rgba(27,23,64,.88);color:#FFF6E5;border:0;border-radius:999px;padding:9px 18px;font-weight:700;cursor:pointer;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.tabs button:focus-visible{outline:3px solid #F7B32B;outline-offset:2px}

/* Sheets */
.sheet{border:0;padding:0;width:100%;max-width:680px;height:100dvh;max-height:100dvh;margin:0 auto;background:var(--bg);color:var(--text);--c-bg:var(--bg);--c-fg:var(--text)}
.sheet::backdrop{background:rgba(10,8,30,.6)}
.sheet-in{height:100%;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 20px calc(env(safe-area-inset-bottom,0px) + 40px)}
.sheet h2{font-size:1.9rem;line-height:1.1;margin:8px 0 4px}
.sheet h3{font-size:1.2rem;margin:0 0 8px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;margin:14px 0}
.panel label{display:block;font-weight:700;margin:10px 0 4px}
.panel select,.panel input:not([type=checkbox]){width:100%;font:inherit;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--text)}
.check{display:flex!important;gap:8px;align-items:center;font-weight:600!important}
.check input{width:20px;height:20px}
.bar{height:12px;border-radius:99px;background:var(--line);overflow:hidden;margin:8px 0}
.bar span{display:block;height:100%;background:var(--marigold)}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.kpi{background:var(--bg);border-radius:14px;padding:10px}
.kpi b{display:block;font-size:1.5rem;line-height:1.1}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.badge{border:1px solid var(--line);border-radius:14px;padding:8px 10px}
.badge.off{opacity:.38}
.badge b{display:block}
.trend li{display:grid;grid-template-columns:5.2em 1fr;gap:8px;align-items:center;margin:6px 0}
.trend .b{height:10px;border-radius:99px;background:var(--mint)}
ul.clean{list-style:none;padding:0;margin:0}
ul.clean>li{border-bottom:1px solid var(--line);padding:12px 0;display:grid;gap:4px}
.top{display:flex;justify-content:space-between;align-items:center;position:sticky;top:0}

.loot{--c-bg:var(--marigold);--c-fg:var(--ink);background:var(--c-bg);color:var(--c-fg);border:0;border-radius:28px;padding:26px;max-width:340px;text-align:center}
.loot::backdrop{background:rgba(10,8,30,.65)}
.loot-emoji{font-size:4rem;line-height:1}
.loot h2{margin:8px 0}
.loot p{margin-bottom:16px}

#toasts{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 72px);left:0;right:0;z-index:40;display:grid;justify-items:center;gap:6px;pointer-events:none}
.toast{background:#FFF6E5;color:#1B1740;border-radius:999px;padding:6px 16px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.3);animation:toast 2.8s forwards;max-width:92vw;text-align:center}
.xp{background:#F7B32B}
@keyframes toast{0%{opacity:0;transform:translateY(8px)}10%,82%{opacity:1;transform:none}100%{opacity:0;transform:translateY(8px)}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="hud" aria-label="Aaj ki progress">
  <span class="pill" id="hStreak" title="Streak">🔥 0</span>
  <span class="pill" id="hFreeze" title="Streak freezes">🧊 1</span>
  <span class="pill" id="hGoal" title="Daily goal">🎯 0/3</span>
  <span class="pill" id="hXP" title="Level">⚡ L1</span>
</header>

<main id="feed" aria-label="Practice feed" tabindex="-1"></main>

<nav class="tabs" aria-label="Sections">
  <button id="tVault">💎 Vault</button>
  <button id="tFeed">⬆️ Feed</button>
  <button id="tMe">🙂 Me</button>
</nav>

<dialog id="sheetMe" class="sheet" aria-label="Profile and settings"><div class="sheet-in" id="meBody"></div></dialog>
<dialog id="sheetVault" class="sheet" aria-label="Phrase vault"><div class="sheet-in" id="vaultBody"></div></dialog>
<dialog id="loot" class="loot" aria-labelledby="lootTitle">
  <p class="loot-emoji" id="lootEmoji">🎁</p>
  <h2 id="lootTitle"></h2>
  <p id="lootText"></p>
  <button class="btn main" id="lootOk">Le liya!</button>
</dialog>
<div id="toasts" aria-live="polite"></div>
<noscript><p style="padding:2rem">Is app ko chalane ke liye JavaScript on karo.</p></noscript>

<script>
"use strict";
/* ================= HELPERS ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s || "").toLowerCase().replace(/[’']/g, "").replace(/[^a-z0-9 ]+/g, " ").replace(/\s+/g, " ").trim();
const wordsOf = s => norm(s).split(" ").filter(Boolean);
const pick = a => a[Math.floor(Math.random() * a.length)];
const today = (o = 0) => { const d = new Date(); d.setDate(d.getDate() + o);
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const daysBetween = (a, b) => Math.round((new Date(b + "T00:00:00") - new Date(a + "T00:00:00")) / 864e5);

function lev(a, b) { // works on strings or arrays
  const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
  let prev = Array.from({length: n + 1}, (_, j) => j);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[n];
}
const simWords = (a, b) => { const x = wordsOf(a), y = wordsOf(b); return x.length && y.length ? 1 - lev(x, y) / Math.max(x.length, y.length) : 0; };
const simChars = (a, b) => { const x = norm(a), y = norm(b); return 1 - lev(x, y) / Math.max(x.length, y.length, 1); };
function usesTarget(text, target) {
  const t = " " + norm(text) + " ", g = norm(target);
  if (t.includes(" " + g)) return true;
  const parts = g.split(" ");
  const hit = parts.filter(p => t.includes(" " + (p.length > 5 ? p.slice(0, -2) : p))).length;
  return hit / parts.length >= .75;
}

/* ================= CONTENT ================= */
const SCENES = [
 {id:"wedding_chaos",goal:"daily",title:"🎂 Shaadi mein cake gir gaya",setup:"A cousin fell into the wedding cake while making a reel. Tell your friend what happened.",opening:"OMG, did you see what happened near the stage? Half the cake is on the floor! Tell me everything!",phrase:"caught me off guard",meaning:"achanak se chaunka diya",example:"The loud crash caught me off guard.",starter:"I was near the stage when…",model1:"I was right near the stage when he tried a backflip for his reel. It totally caught me off guard — he landed straight in the cake!",twist:"Wait, the bride's mother is walking towards us. What do we say to her?",model2:"Let's keep it simple — tell her it was an accident and offer to help clean up."},
 {id:"bizarre_court",goal:"daily",title:"🐕 Kutton ka court case",setup:"Your neighbour says you trained street dogs to steal his newspaper. Defend yourself in court.",opening:"Order! The plaintiff says your dogs steal his newspaper every morning at 6 AM. How do you plead?",phrase:"as far as I know",meaning:"jahaan tak mujhe pata hai",example:"As far as I know, the shop opens at nine.",starter:"Your Honour, I was at home when…",model1:"Your Honour, I'm not guilty. As far as I know, the dogs only follow me because I give them biscuits every evening.",twist:"But a witness saw a dog wearing a collar with your name on it! Explain that.",model2:"That collar was a gift for a dog I adopted last year. As far as I know, he's never touched a newspaper."},
 {id:"office_tea",goal:"work",title:"☕ Galti se Reply-All",setup:"A colleague accidentally replied-all to the whole company with a complaint about his bonus.",opening:"Bro, did you see the email? Rohan replied-all to the CEO about his bonus! What should he do now?",phrase:"keep a low profile",meaning:"chup-chaap rehna, dhyan na kheenchna",example:"I kept a low profile on my first day.",starter:"If I were him, I'd…",model1:"If I were him, I'd keep a low profile today and quietly apologise to the CEO before lunch.",twist:"Too late — HR just called him into a meeting. What should he say?",model2:"He should be honest, apologise for the mistake, and explain his concern calmly."},
 {id:"street_vs_5star",goal:"daily",title:"🌶️ Street food vs 5-star",setup:"Defend street food over an expensive hotel restaurant.",opening:"Convince me: why is a ₹40 plate of pani puri better than a ₹4,000 dinner?",phrase:"value for money",meaning:"paise ke hisaab se achha",example:"This phone is great value for money.",starter:"I prefer street food because…",model1:"Street food is far better value for money — it's fresh, full of flavour, and you leave happy, not hungry.",twist:"But what about hygiene? Isn't street food risky?",model2:"Fair point. I'd pick a busy stall where the food is cooked fresh in front of you."},
 {id:"four_day_week",goal:"work",title:"🏖️ 4-day work week",setup:"Convince your manager to try a four-day week.",opening:"You want Fridays off? Give me one good reason to try a four-day week.",phrase:"make a case for",meaning:"kisi baat ke support mein strong daleel dena",example:"She made a case for working from home.",starter:"I'd like to make a case for…",model1:"I'd like to make a case for a one-month trial. People will focus harder in four days, and we can track the output.",twist:"And who answers clients on Fridays?",model2:"We can rotate one person every Friday, so clients always get a reply."},
 {id:"traffic_superpower",goal:"daily",title:"🚗 Traffic ka gussa",setup:"Rant about a traffic habit that annoys you.",opening:"Tell me — what's the most annoying thing people do in traffic?",phrase:"get on my nerves",meaning:"bahut irritate karna",example:"Loud music on the bus gets on my nerves.",starter:"It really gets on my nerves when…",model1:"It really gets on my nerves when people honk the second the light turns green.",twist:"If you had one superpower on the road, what would it be?",model2:"I'd switch off every horn in the city for one peaceful hour."},
 {id:"angry_vip_client",goal:"work",title:"💼 Naraz client",setup:"A client's launch got delayed by a day and they're angry.",opening:"This is unacceptable! We promised our board a launch today. Why shouldn't I cancel the contract?",phrase:"keep you in the loop",meaning:"aapko har update dete rehna",example:"I'll keep you in the loop about the changes.",starter:"I completely understand. Here's what we're doing…",model1:"I completely understand your frustration. We found a bug last night, the fix is in testing, and I'll keep you in the loop every hour.",twist:"Fine. But what if it slips again tomorrow?",model2:"Then you'll hear it from me first, with a new time and a clear reason."},
 {id:"salary_negotiation",goal:"work",title:"💰 Salary hike ki baat",setup:"Your manager offers 8%. You led two big projects and want more.",opening:"You had a solid year, so we've approved an 8% increase. Budgets are tight, though.",phrase:"room for flexibility",meaning:"thoda adjust karne ki gunjaaish",example:"Is there any room for flexibility on the price?",starter:"Thank you. Given that I led…",model1:"Thank you. Given that I led two major projects this year, is there any room for flexibility on that number?",twist:"What number did you have in mind, and why?",model2:"I was thinking closer to 15%, because both projects brought in new revenue."},
 {id:"deadline_pushback",goal:"work",title:"⏳ Impossible deadline",setup:"Your boss wants two weeks of work done in two days.",opening:"I need the full dashboard ready by Thursday morning. Just make it happen.",phrase:"narrow the scope",meaning:"kaam ko chhota aur focused karna",example:"Let's narrow the scope to the main features.",starter:"By Thursday, I can deliver…",model1:"To deliver quality by Thursday, could we narrow the scope to the top three charts and finish the rest next week?",twist:"The client specifically asked for everything. Now what?",model2:"Then let's show the core charts live and share a clear date for the rest."},
 {id:"hinglish_office",goal:"work",title:"⚡ Office English upgrade",setup:"Say this smoothly to a foreign colleague: 'I'm out of station, please prepone the meeting and revert back.'",opening:"Hi! I heard you wanted to change tomorrow's meeting. What's up?",phrase:"move the meeting up",meaning:"meeting ko pehle karna (prepone)",example:"Could we move the meeting up to 10?",starter:"I'm travelling today, so…",model1:"I'm out of town today. Could we move the meeting up to 10 tomorrow? Please get back to me when you can.",twist:"10 is tricky for me. Can you do 11:30?",model2:"Sure, 11:30 works. I'll send an updated invite."},
 {id:"polite_disagree",goal:"work",title:"🤝 Politely disagree",setup:"A colleague suggests a plan that's way too expensive.",opening:"I think we should hire an agency for ₹10 lakh to redo our website. Thoughts?",phrase:"I see where you're coming from",meaning:"main aapki baat samajh raha hoon",example:"I see where you're coming from, but I'd try a cheaper option first.",starter:"I see where you're coming from, but…",model1:"I see where you're coming from, but given our budget, could we test a smaller fix first?",twist:"A smaller fix won't impress anyone. Why bother?",model2:"It lets us learn what users want before we spend big."},
 {id:"cancellation_spike",goal:"analyst",title:"📊 Ride cancellations badh gaye",setup:"Data analyst interview: ride cancellations in Delhi jumped 20% last week.",opening:"Cancellations went up 20% last week. Walk me through your first two checks.",phrase:"rule out",meaning:"kisi wajah ko check karke hata dena",example:"Let's rule out a data error first.",starter:"First, I'd rule out…",model1:"First, I'd rule out a data or app bug. Then I'd split cancellations by hour and area to see where the jump is.",twist:"The data is fine, and the spike is only at night. What next?",model2:"I'd compare driver supply at night and check if surge pricing or wait times changed."},
 {id:"metro_mixup",goal:"daily",title:"🚇 Galat metro pakad li",setup:"You took the wrong metro and your friend is waiting.",opening:"Hey, where are you? I've been waiting for 15 minutes!",phrase:"get back on track",meaning:"wapas sahi raaste par aana",example:"We're behind, but we can get back on track.",starter:"Sorry, I took the wrong line…",model1:"So sorry! I took the wrong line, but I'm changing at Rajiv Chowk to get back on track. I'll be there in 20 minutes.",twist:"20 minutes?! Should I just order food without you?",model2:"Yes, please go ahead and order. I'll pay for the starters."},
 {id:"dashboard_demo",goal:"analyst",title:"📈 Dashboard samjhao",setup:"Give your manager a one-minute update on a sales dashboard.",opening:"I've only got a minute. What changed this month?",phrase:"walk you through",meaning:"step by step samjhana",example:"Let me walk you through the numbers.",starter:"The main change this month is…",model1:"Let me walk you through it quickly. Revenue is up 12%, mostly from repeat customers in Delhi.",twist:"Why only Delhi? What happened in other cities?",model2:"Other cities were flat. Delhi had a discount campaign, so I'd test it elsewhere next."},
 {id:"intro_interview",goal:"work",title:"🙋 Tell me about yourself",setup:"The opening question of a job interview.",opening:"Let's start simple. Tell me about yourself.",phrase:"I've been working on",meaning:"main … par kaam kar raha hoon (kuch time se)",example:"I've been working on my communication skills.",starter:"I'm … and for the last … I've been working on…",model1:"I'm a commerce graduate from Delhi. For the last two years, I've been working on data reports in Excel, and now I'm building my SQL skills.",twist:"Interesting. Why do you want to leave your current job?",model2:"I've learned a lot there, but I'm looking for bigger problems and more growth."},

  typeCount:{},badges:{},srs:{},vault:[],history:[],seen:{},ai:{drills:[],words:[]},custom:[],goal:"all",autoplay:true,seenIntro:false};
const SCENE_IDS = new Set(SCENES.map(s => s.id));
function migrate() {
  try {
    const o = JSON.parse(localStorage.getItem("jfa_arena_v2")); if (!o) return null;
    const s = {xp:o.xp||0, streak:o.streak||0, lastGoalDay:o.lastDay||"", vault:[], srs:{}, custom:[]};
    for (const id of Object.keys(o.cards||{})) if (SCENE_IDS.has(id)) s.srs["sc:"+id] = {step:0, due:today()};
    for (const p of (o.customPhrases||[])) if (p && p.phrase) s.vault.push({en:p.phrase, hi:p.hook||"", from:p.sceneTitle||"Purana app"});
    for (const g of (o.generated||[])) { const L = g?.lesson, sc = g?.scene;
      if (sc && Array.isArray(L) && L.length === 7) s.custom.push({id:sc.id,goal:"custom",title:sc.title,setup:sc.prompt,opening:sc.openingAI,
        phrase:L[0],meaning:L[1],example:L[2],starter:L[3],model1:L[4],twist:L[5],model2:L[6]}); }
    return s;
  } catch { return null; }
}
function load() {
  let s = null; try { s = JSON.parse(localStorage.getItem(STORE)); } catch {}
  if (!s) s = migrate();
  const base = JSON.parse(JSON.stringify(DEFAULT));
  return Object.assign(base, s || {});
}
let S = load();
let saveTimer = null;
function save() { clearTimeout(saveTimer); try { localStorage.setItem(STORE, JSON.stringify(S)); } catch { toast("Progress save nahi hua — browser storage full ya block hai."); } hud(); }
function saveSoon() { clearTimeout(saveTimer); saveTimer = setTimeout(save, 800); }

const allWords = () => WORDS.concat(S.ai.words || []);
const allDrills = () => DRILLS.concat(S.ai.drills || []);
const allScenes = () => SCENES.concat(S.custom || []);
const sceneById = id => allScenes().find(s => s.id === id);
function scenePool() {
  const all = allScenes();
  const pool = S.goal === "all" ? all : all.filter(s => s.goal === S.goal || s.goal === "custom");
  return pool.length ? pool : all;
}
function itemFor(id) {
  const k = id.slice(0, id.indexOf(":")), r = id.slice(id.indexOf(":") + 1);
  if (k === "w") { const w = allWords().find(x => x[0] === r); return w && {kind:"word",hi:w[1],en:w[0],ex:w[2]}; }
  if (k === "p") { const p = PHRASES.find(x => x[0] === r); return p && {kind:"phrase",hi:p[1],en:p[0],ex:p[2]}; }
  if (k === "sc") { const sc = sceneById(r); return sc && {kind:"phrase",hi:sc.meaning,en:sc.phrase,ex:sc.example}; }
  if (k === "d") { const d = allDrills().find(x => x[0] === r); return d && {kind:"drill",hi:d[0],en:d[1],ex:d[2]}; }
  return null;
}
function srsAdd(id, step = 0) { if (!S.srs[id]) S.srs[id] = {step, due: today(INTERVALS[step])}; }
function srsGrade(id, ok) {
  const c = S.srs[id] || {step:0};
  c.step = ok ? Math.min(c.step + 1, INTERVALS.length - 1) : 0;
  c.due = today(ok ? INTERVALS[c.step] : 1);
  S.srs[id] = c; return c;
}
const dueIds = () => Object.keys(S.srs).filter(id => S.srs[id].due <= today() && itemFor(id)).sort((a,b) => S.srs[a].due.localeCompare(S.srs[b].due));
const whenLabel = d => { const n = daysBetween(today(), d); return n <= 0 ? "aaj" : n === 1 ? "kal" : n + " din baad"; };
const level = () => 1 + Math.floor(S.xp / 150);
const levelName = () => LEVELS[Math.min(level() - 1, LEVELS.length - 1)];
function shownStreak() {
  if (!S.lastGoalDay) return 0;
  const gap = daysBetween(S.lastGoalDay, today());
  return gap <= 1 || gap - 1 <= S.freezes ? S.streak : 0;
}
function dayRoll() { if (S.day !== today()) { S.day = today(); S.cardsToday = 0; } }

/* ================= UI BITS ================= */
function toast(msg, cls = "") {
  const t = document.createElement("div"); t.className = "toast " + cls; t.textContent = msg;
  $("#toasts").append(t); setTimeout(() => t.remove(), 2900);
}
function hud() {
  const st = shownStreak(), doneToday = S.lastGoalDay === today();
  $("#hStreak").textContent = "🔥 " + st; $("#hStreak").classList.toggle("risk", !doneToday && st > 0);
  $("#hStreak").title = doneToday ? "Aaj ki streak pakki" : "Aaj 3 cards karke streak bachao";
  $("#hFreeze").textContent = "🧊 " + S.freezes;
  $("#hGoal").textContent = "🎯 " + Math.min(S.day === today() ? S.cardsToday : 0, GOAL) + "/" + GOAL;
  $("#hXP").textContent = "⚡ L" + level();
}

const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
let listening = null;
function listen(o) {
  abortListening(); window.speechSynthesis?.cancel();
  if (!Rec) { o.onError?.("Is browser mein mic se typing nahi chalti. Chrome use karo, ya ⌨️ dabake type karo."); return null; }
  const s = {o, base:"", text:"", start:0, last:0, pauses:0, longest:0, inPause:false, pauseStart:0, wantStop:false, discard:false, ended:false, err:"", restarts:0};
  listening = s;

    const r = new Rec(); s.r = r;
    r.lang = "en-IN"; r.continuous = true; r.interimResults = true; r.maxAlternatives = 1;
    r.onstart = () => { if (!s.start) { s.start = Date.now(); s.last = s.start; o.onStart?.(); } };
    r.onresult = e => {
      const now = Date.now();
      if (s.inPause) { s.inPause = false; s.longest = Math.max(s.longest, now - s.pauseStart); }
      s.last = now;
      const parts = [];
      for (const res of e.results) { // Android Chrome sometimes repeats growing results; keep the longest
        const t = res[0].transcript.trim(); if (!t) continue;
        const prev = parts[parts.length - 1];
        if (prev && norm(t).startsWith(norm(prev))) parts[parts.length - 1] = t; else parts.push(t);
      }
      s.text = (s.base + " " + parts.join(" ")).replace(/\s+/g, " ").trim();
      o.onText?.(s.text);
    };

    r.onend = () => {
      const fatal = ["not-allowed","service-not-allowed","audio-capture","language-not-supported","network"].includes(s.err);
      const timeLeft = !o.max || Date.now() - s.start < o.max * 1000;
      if (!s.wantStop && !s.discard && !fatal && timeLeft && s.restarts < 8) { // phones stop on silence: keep going
        s.restarts++; s.base = s.text; s.err = "";
        try { boot(); return; } catch {}
      }
      finish(s);
    };
    try { r.start(); } catch { s.err = "start"; finish(s); }
  };
  s.tick = setInterval(() => {
    if (!s.start) return;
    const now = Date.now();
    if (s.text && !s.inPause && now - s.last > 1200) { s.inPause = true; s.pauseStart = s.last; s.pauses++; }
    if (o.max) { const left = Math.max(0, o.max - Math.floor((now - s.start) / 1000)); o.onTick?.(left); if (!left) stopListening(); }

}

  if (s.inPause) s.pauses = Math.max(0, s.pauses - 1); // silence before pressing stop isn't a hesitation
  if (!s.text) {
    s.o.onError?.(["not-allowed","service-not-allowed"].includes(s.err)
      ? "Mic ki permission block hai. Address bar mein 🔒 dabake microphone allow karo."
      : s.err === "network" ? "Mic typing ke liye internet chahiye. Connection check karo."
      : "Kuch sunai nahi diya. Phir se try karo, ya ⌨️ se type karo.");
    return;
  }
  const secs = Math.max(.5, (s.last - s.start) / 1000), words = wordsOf(s.text).length;
  s.o.onDone({text:s.text, words, seconds:secs, wpm: secs >= 3 ? Math.round(words * 60 / secs) : null,
    pauses:s.pauses, longest:Math.round(s.longest / 100) / 10, typed:false});
}

const PROVIDERS = {
  gemini:{label:"Gemini", keyRe:/^(?:AIza|AQ\.)[A-Za-z0-9._-]+$/, keyHint:"AIza… ya AQ.…", def:"gemini-3.1-flash-lite"},

  ollama:{label:"Ollama (local)", keyRe:null, keyHint:"", def:""}
};
const AIS = {remember:false, list:[]}; // list order = try order
try {
  localStorage.removeItem("jfa_user_api_key");
  const raw = JSON.parse(localStorage.getItem("jf_ai") || sessionStorage.getItem("jf_ai") || "null");
  if (raw && Array.isArray(raw.list)) { AIS.remember = !!raw.remember; AIS.list = raw.list.filter(c => c && PROVIDERS[c.provider]); }
  else if (raw && (raw.key || raw.provider === "ollama")) { // v3.0 single-key settings
    AIS.remember = !!raw.remember;
    AIS.list = [{id:"c" + Date.now(), provider: raw.provider === "ollama" ? "ollama" : (raw.key || "").startsWith("gsk_") ? "groq" : "gemini",
      key:raw.key || "", model:raw.model || "", url:raw.ollama || "http://localhost:11434"}];
  }
} catch {}
function persistAI() {
  try {
    localStorage.removeItem("jf_ai"); sessionStorage.removeItem("jf_ai");
    if (!AIS.list.length) return;
    (AIS.remember ? localStorage : sessionStorage).setItem("jf_ai", JSON.stringify({remember:AIS.remember, list:AIS.list}));
  } catch {}
}
const aiReady = () => AIS.list.length > 0;
const modelOf = c => c.model || PROVIDERS[c.provider].def;
const connLabel = c => PROVIDERS[c.provider].label + (modelOf(c) ? " · " + modelOf(c) : "");
const sleep = ms => new Promise(r => setTimeout(r, ms));
const cool = {}; // connection id -> time until which it is tried last
const TRANSIENT = [408, 429, 500, 502, 503, 504];
const isRetryable = e => TRANSIENT.includes(e?.status) || e?.name === "TimeoutError" || e?.name === "AbortError" || e instanceof TypeError;

function httpError(status, b) {
  const bad = b?.error?.details?.some?.(d => d.reason === "API_KEY_INVALID");
  const m = status === 401 || bad ? "Key reject ho gayi (401)."
    : status === 403 ? "Access denied (403)."
    : status === 404 ? "Model nahi mila (404)."
    : status === 429 ? "Limit khatam (429)."
    : status === 503 ? "Server busy (503)."
    : "Error (HTTP " + status + ").";
  const e = new Error(m); e.status = status; return e;
}
function parseJSON(raw) {
  const t = String(raw || "").replace(/^\s*```(?:json)?/i, "").replace(/```\s*$/, "").trim();
  try { return JSON.parse(t); } catch {}
  const a = t.indexOf("{"), b = t.lastIndexOf("}");
  if (a >= 0 && b > a) return JSON.parse(t.slice(a, b + 1));
  throw new SyntaxError("not json");
}
async function callOne(c, instruction, payload, fields) {
  const message = JSON.stringify(payload), model = modelOf(c);
  let url, headers = {"Content-Type":"application/json"}, body;
  const chat = [{role:"system", content:instruction + " Reply with JSON only."}, {role:"user", content:message}];
  if (c.provider === "gemini") {
    url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`;
    headers["x-goog-api-key"] = c.key;
    body = {systemInstruction:{parts:[{text:instruction}]}, contents:[{role:"user",parts:[{text:message}]}], generationConfig:{responseMimeType:"application/json"}};
  } else if (c.provider === "groq") {
    url = "https://api.groq.com/openai/v1/chat/completions"; headers.Authorization = "Bearer " + c.key;
    body = {model, response_format:{type:"json_object"}, messages:chat};
  } else if (c.provider === "xai") {
    if (!model) throw new Error("Grok ke liye Model ID chahiye.");
    url = "https://api.x.ai/v1/chat/completions"; headers.Authorization = "Bearer " + c.key;
    body = {model, messages:chat};
  } else {
    if (!model) throw new Error("Ollama ka model chuno.");
    url = (c.url || "http://localhost:11434").replace(/\/+$/, "") + "/api/chat";
    body = {model, stream:false, format:"json", messages:chat};
  }
  const res = await fetch(url, {method:"POST", headers, body:JSON.stringify(body), signal:AbortSignal.timeout(c.provider === "ollama" ? 90000 : 15000)});
  if (!res.ok) throw httpError(res.status, await res.json().catch(() => null));
  const data = await res.json();
  const raw = c.provider === "gemini" ? (data.candidates?.[0]?.content?.parts || []).filter(x => x.text && !x.thought).map(x => x.text).join("")
    : c.provider === "ollama" ? data.message?.content : data.choices?.[0]?.message?.content;
  const result = parseJSON(raw);
  if (!fields) return result;
  if (!result || !fields.every(f => typeof result[f] === "string" && result[f].trim())) throw new Error("Jawab adhoora tha.");
  return Object.fromEntries(fields.map(f => [f, result[f].trim().slice(0, 900)]));
}
// Tries each connection in order; skips busy ones to the end; one quick retry on 5xx.
async function askAIMeta(instruction, payload, fields, only) {
  const now = Date.now();
  const list = only ? [only] : [...AIS.list].sort((a, b) => ((cool[a.id] || 0) > now) - ((cool[b.id] || 0) > now));
  if (!list.length) throw new Error("AI connected nahi hai.");
  const failed = [];
  for (const c of list) {
    for (let attempt = 0; attempt < 2; attempt++) {
      try {
        const result = await callOne(c, instruction, payload, fields);
        delete cool[c.id];
        if (failed.length && !only) toast(`⚠️ ${failed.map(f => f.who).join(", ")} busy — ${connLabel(c)} se jawab liya`);
        return {result, via:c, failed};
      } catch (e) {
        if (attempt === 0 && !only && [500, 502, 503, 504].includes(e.status)) { await sleep(700); continue; }
        if (isRetryable(e)) cool[c.id] = Date.now() + 90e3;
        failed.push({who:connLabel(c), msg:errMsg(e)});
        break;
      }
    }
  }
  const err = new Error(failed.map(f => f.who + ": " + f.msg).join(" · ")); err.all = failed; throw err;
}
const askAI = async (instruction, payload, fields, only) => (await askAIMeta(instruction, payload, fields, only)).result;

async function listModels(c) {
  let url, headers = {};
  if (c.provider === "gemini") { url = "https://generativelanguage.googleapis.com/v1beta/models?pageSize=200"; headers["x-goog-api-key"] = c.key; }
  else if (c.provider === "groq") { url = "https://api.groq.com/openai/v1/models"; headers.Authorization = "Bearer " + c.key; }
  else if (c.provider === "xai") { url = "https://api.x.ai/v1/models"; headers.Authorization = "Bearer " + c.key; }
  else url = (c.url || "http://localhost:11434").replace(/\/+$/, "") + "/api/tags";
  const res = await fetch(url, {headers, signal:AbortSignal.timeout(15000)});
  if (!res.ok) throw httpError(res.status, await res.json().catch(() => null));
  const d = await res.json();
  if (c.provider === "gemini") return (d.models || []).filter(m => (m.supportedGenerationMethods || []).includes("generateContent")).map(m => m.name.replace(/^models\//, ""));
  if (c.provider === "ollama") return (d.models || []).map(m => m.name);
  return (d.data || []).map(m => m.id);
}
function errMsg(e) {
  if (e?.name === "TimeoutError" || e?.name === "AbortError") return "Time out ho gaya.";
  if (e instanceof TypeError) return "Pahunch nahi paaye (internet / CORS / Ollama band?).";
  if (e instanceof SyntaxError) return "Jawab samajh nahi aaya.";
  return e?.message || "AI abhi available nahi hai.";
}

const COACH_BASE = "You are a warm, practical English speaking coach for a Hindi-speaking Indian adult who hesitates when speaking. The learner's text is a speech-to-text transcript: ignore missing punctuation, capitalization and obvious recognition slips. Write every explanation in simple Hinglish using Roman letters (Hindi words written in English script), never Devanagari. Mention at most the 2 most important mistakes. Never shame the learner. Return only a JSON object whose values are all strings.";

function diffWords(ref, said) {
  const pool = {}; for (const w of wordsOf(said)) pool[w] = (pool[w] || 0) + 1;
  let hit = 0;
  const html = ref.split(/\s+/).map(tok => { const w = norm(tok);
    if (w && pool[w]) { pool[w]--; hit++; return esc(tok); } return w ? `<s>${esc(tok)}</s>` : esc(tok); }).join(" ");
  return {score: Math.round(100 * hit / Math.max(1, wordsOf(ref).length)), html};
}

/* ================= FEED ENGINE ================= */
const feed = $("#feed");
const sessionUsed = new Set();
let current = null, sessionStart = Date.now(), breakShown = false, userActed = false;
const PATTERN = ["word","shadow","drill","quiz","phrase","drill","word","BIG"];
let pPos = 0, bigRole = Math.random() < .5;

function fresh(pool, keyFn) {
  let cand = pool.filter(x => !sessionUsed.has(keyFn(x))); if (!cand.length) cand = pool;
  let min = Infinity; for (const x of cand) min = Math.min(min, S.seen[keyFn(x)] || 0);
  const it = pick(cand.filter(x => (S.seen[keyFn(x)] || 0) === min));
  sessionUsed.add(keyFn(it)); return it;
}
function makeCard(type) {
  if (type === "word") { const w = fresh(allWords(), x => "w:" + x[0]); return {type, id:"w:" + w[0], d:{en:w[0], hi:w[1], ex:w[2]}}; }
  if (type === "phrase") { const p = fresh(PHRASES, x => "p:" + x[0]); return {type, id:"p:" + p[0], d:{en:p[0], hi:p[1], ex:p[2]}}; }
  if (type === "shadow") { const s = fresh(SHADOW, x => "s:" + x); return {type, id:"s:" + s, d:{en:s}}; }
  if (type === "drill") { const d = fresh(allDrills(), x => "d:" + x[0]); return {type, id:"d:" + d[0], d:{hi:d[0], en:d[1], pat:d[2]}}; }
  if (type === "quiz") { const q = fresh(QUIZ, x => "q:" + x[0]); return {type, id:"q:" + q[0], d:{wrong:q[0], right:q[1], tip:q[2]}}; }
  if (type === "speak") { const t = fresh(TOPICS, x => "t:" + x); return {type, id:"t:" + t, d:{topic:t}}; }
  const sc = fresh(scenePool(), x => "r:" + x.id); return {type:"role", id:"r:" + sc.id, d:sc};
}
function nextBatch() {
  const out = [], due = dueIds().filter(id => !sessionUsed.has("rc:" + id)).slice(0, 2);
  for (let i = 0; i < 6; i++) {
    let t = PATTERN[pPos++ % PATTERN.length];
    if (t === "BIG") { t = bigRole ? "role" : "speak"; bigRole = !bigRole; }
    out.push(makeCard(t));
    if ((i === 1 || i === 4) && due.length) { const id = due.shift(); sessionUsed.add("rc:" + id); out.push({type:"recall", id:"rc:" + id, d:{itemId:id}}); }
  }
  return out;
}
function appendCards(list, after) {
  for (const c of list) {
    const el = RENDER[c.type](c); if (!el) continue;
    if (after) { after.after(el); after = el; } else feed.append(el);
    io.observe(el);
  }
}
const io = new IntersectionObserver(es => { for (const e of es) if (e.isIntersecting) activate(e.target); }, {root:feed, threshold:.6});
function activate(el) {
  if (current === el) return;
  if (current && current._c.type !== "note" && !current._done) combo = 0;
  abortListening(); window.speechSynthesis?.cancel();
  current = el;
  const c = el._c;
  if (c.type === "note" && c.d.kind === "welcome" && !S.seenIntro) { S.seenIntro = true; saveSoon(); }
  if (c.id) { S.seen[c.id] = (S.seen[c.id] || 0) + 1; saveSoon(); }
  const kids = feed.children, idx = Array.prototype.indexOf.call(kids, el);
  if (idx >= kids.length - 3) appendCards(nextBatch());
  if (!breakShown && Date.now() - sessionStart > 25 * 60e3) { breakShown = true; appendCards([{type:"note", d:{kind:"break"}}], el); }
  if (userActed && S.autoplay && el._auto && !el._done) setTimeout(() => { if (current === el) el._auto(); }, 350);
}

<div class="panel"><h3>Badges</h3><div class="badges">${BADGES.map(([id, e, n, d]) => `<div class="badge ${S.badges[id] ? "" : "off"}"><b>${e} ${esc(n)}</b><span class="small muted">${esc(d)}</span></div>`).join("")}</div></div>
<div class="panel"><h3>Bolne ki speed (non-stop challenge)</h3>${hist.length ? `<ul class="clean trend">${hist.map(h => `<li><span class="small">${esc(h.d.slice(5))}</span><span><span class="b" style="display:block;width:${Math.round((h.wpm || 0) / maxW * 100)}%"></span><span class="small muted">${h.wpm || "—"} wpm · ${h.pauses} pause · ${h.fillers} filler</span></span></li>`).join("")}</ul>` : `<p class="muted">Pehla “⏱️ Non-stop challenge” karo — yahan aapki speed aur pauses ka record banega.</p>`}</div>

<p class="muted small">Upar wala pehle try hota hai. Woh fail ho (503, limit, timeout) toh agla apne aap try hota hai. Sab fail ho tabhi offline check chalta hai.</p>

<div id="cKeyBox"><label for="cKey">API key</label><input id="cKey" type="password" autocomplete="off"></div>
<div id="cUrlBox" hidden><label for="cUrl">Ollama URL</label><input id="cUrl" value="http://localhost:11434"></div>
<label for="cModel">Model</label>

  renderConns();
  const prov = $("#cProv"), sync = () => { const o = prov.value === "ollama"; $("#cUrlBox").hidden = !o; $("#cKeyBox").hidden = o;
    $("#cKey").placeholder = PROVIDERS[prov.value].keyHint; $("#cModel").placeholder = PROVIDERS[prov.value].def || "Models dikhao dabao"; $("#cModels").innerHTML = ""; };
  prov.value = AIS.list.length ? "groq" : "gemini"; sync(); prov.onchange = sync;
  $("#aiRemember").onchange = e => { AIS.remember = e.target.checked; persistAI(); };
  $("#cList").onclick = fillModels;
  $("#cAdd").onclick = addConn;
  $("#cTestAll").onclick = testAll;
  $("#crGo").onclick = makeCustomRole;
  $("#rfGo").onclick = refillContent;
  $("#goalSel").value = S.goal; $("#goalSel").onchange = e => { S.goal = e.target.value; save(); };
  $("#autoPlay").onchange = e => { S.autoplay = e.target.checked; save(); };
  $("#exBtn").onclick = exportData;
  $("#imBtn").onclick = () => $("#imFile").click();

}

const aiNote = t => { const n = $("#aiNote"); if (n) n.textContent = t; };
function draftConn() {
  const provider = $("#cProv").value;
  return {id:"c" + Date.now(), provider, key:$("#cKey").value.trim().replace(/^["']|["']$/g, ""),
    model:$("#cModel").value.trim().replace(/^models\//, ""), url:$("#cUrl").value.trim() || "http://localhost:11434"};
}
function renderConns() {
  const ul = $("#connList"); if (!ul) return;
  ul.innerHTML = AIS.list.length ? AIS.list.map((c, i) => `<li>
<p class="strong">${i + 1}. ${esc(connLabel(c))}</p>
<p class="muted small">${c.provider === "ollama" ? esc(c.url) : "Key …" + esc(c.key.slice(-4))}${(cool[c.id] || 0) > Date.now() ? " · abhi busy, baad mein try hoga" : ""}</p>
<div class="row"><button class="btn tiny" data-a="up" data-i="${i}" ${i ? "" : "disabled"}>▲</button><button class="btn tiny" data-a="down" data-i="${i}" ${i < AIS.list.length - 1 ? "" : "disabled"}>▼</button>
<button class="btn tiny" data-a="test" data-i="${i}">Test</button><button class="btn tiny" data-a="del" data-i="${i}">Hatao</button></div></li>`).join("")
    : `<li><p class="muted">Abhi koi AI nahi juda — offline check chal raha hai. Neeche se jodo.</p></li>`;
  ul.querySelectorAll("button[data-a]").forEach(b => b.onclick = async () => {
    const i = +b.dataset.i, L = AIS.list;
    if (b.dataset.a === "up") [L[i - 1], L[i]] = [L[i], L[i - 1]];
    if (b.dataset.a === "down") [L[i + 1], L[i]] = [L[i], L[i + 1]];
    if (b.dataset.a === "del") L.splice(i, 1);
    if (b.dataset.a === "test") { b.disabled = true; aiNote("Test ho raha hai: " + connLabel(L[i]) + "…");
      try { await askAI(TEST_PROMPT, {test:"connection"}, ["status"], L[i]); delete cool[L[i].id]; aiNote("✅ " + connLabel(L[i]) + " chal raha hai."); }
      catch (e) { aiNote("❌ " + connLabel(L[i]) + ": " + errMsg(e)); } b.disabled = false; return; }
    persistAI(); renderConns();
  });
}
const TEST_PROMPT = 'Return a JSON object with one string field named "status" set to "ok".';
async function fillModels() {
  const c = draftConn();
  if (c.provider !== "ollama" && !c.key) { aiNote("Pehle key paste karo, phir Models dikhao."); return; }
  aiNote("Models la raha hoon…");
  try {
    const ms = await listModels(c);
    $("#cModels").innerHTML = ms.map(m => `<option value="${esc(m)}">`).join("");
    aiNote(ms.length ? `${ms.length} models mile. Model box mein click karke chuno.` : "Koi model nahi mila.");
    if (!$("#cModel").value && ms.length && !PROVIDERS[c.provider].def) $("#cModel").value = ms[0];
  } catch (e) { aiNote("❌ Models nahi aaye: " + errMsg(e)); }
}
async function addConn() {
  const c = draftConn(), P = PROVIDERS[c.provider];
  if (P.keyRe && !P.keyRe.test(c.key)) { aiNote(`${P.label} ki poori key paste karo (${P.keyHint}).`); return; }
  if (AIS.list.some(x => x.provider === c.provider && x.key === c.key && modelOf(x) === modelOf(c) && x.url === c.url)) { aiNote("Yeh connection pehle se juda hai."); return; }
  const btn = $("#cAdd"); btn.disabled = true; aiNote("Test ho raha hai…");
  try {
    if (!modelOf(c)) { const ms = await listModels(c); if (!ms.length) throw new Error("Koi model nahi mila."); c.model = ms[0]; }
    await askAI(TEST_PROMPT, {test:"connection"}, ["status"], c);
    AIS.list.push(c); AIS.remember = $("#aiRemember").checked; persistAI();
    $("#cKey").value = ""; $("#cModel").value = "";
    aiNote(`✅ Jud gaya: ${connLabel(c)} (number ${AIS.list.length} par).`); renderConns();
  } catch (e) { aiNote("❌ " + errMsg(e)); }
  finally { btn.disabled = false; }
}
async function testAll() {
  if (!AIS.list.length) { aiNote("Pehle koi connection jodo."); return; }
  aiNote("Sab test ho rahe hain…"); const out = [];
  for (const c of AIS.list) {
    try { await askAI(TEST_PROMPT, {test:"connection"}, ["status"], c); delete cool[c.id]; out.push("✅ " + connLabel(c)); }
    catch (e) { out.push("❌ " + connLabel(c) + " — " + errMsg(e)); }
  }
  aiNote(out.join("  |  ")); renderConns();
}

async function makeCustomRole() {
  const topic = $("#crIn").value.trim().slice(0, 200), note = t => { $("#crNote").textContent = t; };
  if (!topic) { note("Pehle situation likho."); return; }
  const btn = $("#crGo"); btn.disabled = true; note("Ban raha hai…");
  const id = "custom_" + Date.now();
  let sc = {id, goal:"custom", title:"✨ " + topic.slice(0, 40), setup:topic, opening:`Okay, let's start. ${topic} — what would you say first?`,
    phrase:"the thing is", meaning:"baat yeh hai ki", example:"The thing is, I need a little more time.", starter:"The thing is…",
    model1:"The thing is, I'd like to find a solution that works for both of us.", twist:"Hmm, I'm not sure that works for me. Why should I agree?", model2:"I understand. Let's start with a small step and see how it goes."};
  const fields = ["title","setup","opening","phrase","meaning","example","starter","model1","twist","model2"];
  try {
    if (aiReady()) {
      const r = await askAI("Create a short English speaking roleplay for a Hindi-speaking Indian learner (A2-B1). Return a JSON object with string fields: title (under 45 characters, start with one emoji), setup (one English sentence describing the situation), opening (the other character's first line, ending with a question), phrase (one useful natural English phrase for this situation), meaning (its meaning in Hinglish written in Roman letters), example (short example sentence using the phrase), starter (a sentence starter for the learner, ending with '…'), model1 (a good sample answer to the opening), twist (the other character's challenging follow-up line), model2 (a good sample answer to the twist).", {situation:topic}, fields);
      sc = {...r, id, goal:"custom"};
    }
    note(aiReady() ? "✅ Ban gaya! Feed mein agla card yahi hai." : "Template se ban gaya (AI connect karoge toh better scene banega).");
  } catch (e) { note("AI nahi chala (" + errMsg(e) + ") — template se bana diya."); }
  finally { btn.disabled = false; }
  S.custom.push(sc); S.custom = S.custom.slice(-40); save();
  $("#crIn").value = "";
  appendCards([{type:"role", id:"r:" + sc.id, d:sc}], current);
  setTimeout(() => { $("#sheetMe").close(); current?.nextElementSibling?.scrollIntoView({behavior:"smooth"}); }, 700);
}

async function refillContent() {
  const note = t => { $("#rfNote").textContent = t; };
  if (!aiReady()) { note("Pehle upar AI connect karo."); return; }
  const btn = $("#rfGo"); btn.disabled = true; note("AI naye cards bana raha hai…");
  try {
    const have = allDrills().map(d => d[1]).slice(-40).concat(allWords().map(w => w[0]).slice(-40));
    const r = await askAI(`Create fresh practice content for a Hindi-speaking Indian adult learning spoken English (A2-B1 level), focused on everyday life, office and conversations. Return a JSON object with two arrays: "drills" with 10 items {"hi": an everyday sentence in Hinglish written in Roman letters, "en": a natural English translation, "pattern": a short grammar label}, and "words" with 8 items {"word": a useful everyday English word or phrase, "meaning": its meaning in Hinglish in Roman letters, "example": a short natural example sentence}. Do not repeat any of these: ${have.join("; ")}.`, {request:"new cards"}, null);
    const ok = (o, ks) => o && ks.every(k => typeof o[k] === "string" && o[k].trim() && o[k].length < 220);
    const drills = (Array.isArray(r?.drills) ? r.drills : []).filter(d => ok(d, ["hi","en","pattern"])).map(d => [d.hi.trim(), d.en.trim(), d.pattern.trim()]);
    const words = (Array.isArray(r?.words) ? r.words : []).filter(w => ok(w, ["word","meaning","example"])).map(w => [w.word.trim(), w.meaning.trim(), w.example.trim()]);
    const oldD = new Set(allDrills().map(d => d[0])), oldW = new Set(allWords().map(w => w[0].toLowerCase()));
    const nd = drills.filter(d => !oldD.has(d[0])), nw = words.filter(w => !oldW.has(w[0].toLowerCase()));
    S.ai.drills = S.ai.drills.concat(nd).slice(-300); S.ai.words = S.ai.words.concat(nw).slice(-300); save();
    note(`✅ ${nd.length} drills aur ${nw.length} words add ho gaye. Feed mein aate rahenge.`);
  } catch (e) { note("❌ " + errMsg(e)); }
  finally { btn.disabled = false; }
}

function exportData() {
  const blob = new Blob([JSON.stringify(S, null, 1)], {type:"application/json"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `jugaad-fluency-backup-${today()}.json`;
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function importData(e) {
  const f = e.target.files?.[0]; if (!f) return;
  f.text().then(t => {
    const o = JSON.parse(t);
    if (!o || typeof o.xp !== "number" || typeof o.srs !== "object") throw new Error("bad");
    if (!confirm("Is backup se abhi ka progress replace ho jaayega. Theek hai?")) return;
    S = Object.assign(JSON.parse(JSON.stringify(DEFAULT)), o); save(); location.reload();
  }).catch(() => toast("Yeh file sahi backup nahi lag rahi."));
}

/* ================= START ================= */
dayRoll(); hud();
appendCards((S.seenIntro ? [] : [{type:"note", d:{kind:"welcome"}}]).concat(nextBatch()));
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
